# =========================================================================
# Harvey AI Sales Agent — Aneka Labs Nginx Reverse Proxy Configuration
# Target Subdomains: harvey.anekalabs.com, api.harvey.anekalabs.com, docs.harvey.anekalabs.com
# Drop-in path: /etc/nginx/sites-available/harvey.anekalabs.com
# =========================================================================

# Upstream connection to local Harvey daemon (FastAPI / Uvicorn)
upstream harvey_backend {
    server 127.0.0.1:5555;
    keepalive 32;
}

# 1. Main Application & Dashboard UI
server {
    server_name harvey.anekalabs.com;

    location / {
        proxy_pass http://harvey_backend;
        proxy_http_version 1.1;

        # Mandatory Host and Proxy Headers for Harvey Host Header Defense
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets & Server-Sent Events (SSE) Streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # Buffer limits (for PDF uploads in Knowledge tab)
        client_max_body_size 25M;
    }

    listen 80;
}

# 2. Dedicated REST API Gateway Subdomain
server {
    server_name api.harvey.anekalabs.com;

    location / {
        proxy_pass http://harvey_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        client_max_body_size 25M;
    }

    listen 80;
}

# 3. Interactive API Documentation (OpenAPI / Swagger UI)
server {
    server_name docs.harvey.anekalabs.com;

    location / {
        # Rewrites root to FastAPI OpenAPI Swagger documentation
        proxy_pass http://harvey_backend/docs;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}

